    <section>

      <div class="inner-wrapper">
        <figure>
            <img src="johanna string of heart.webp" alt="Animation einer um die eigene Achse drehenden String of Hearts">

    <section id="gewaechshaus">

            <h2>
                ⭒｡꩜˚always in my little garden˚꩜｡⭒
            </h2>
            <p>
                 
            </p>
            <div class="swiper">
            <!-- Additional required wrapper -->

                <!-- Slides -->
                <div class="swiper-slide">
                    <img src="1.png" alt="ein kindle">
                        <p>
                            my stories to forget about the world

                </div>
                <div class="swiper-slide">
                    <figure>
                        <img src="2.png" alt="Sony headphones">
                        <p>
                            my emotional support headphones
                        </p>
                    </figure>
                </div>

            <figure> 
                <figcaption>

                </figcaption>

            </figure>
            <button class="vollbild">Vollbild</button>
        </div>
